version = 1

# =============================================================================
# llama-server --models-preset reference
#
# This file configures llama-server's "router" mode: one server process
# hosts every model listed below, loading/unloading them on demand as
# requests select them via the API's "model" field (see --models-max in
# start-llama-cpp-server.bat for how many can be resident at once).
#
# Format notes:
#   - Section names become the model id used in API requests.
#   - [*] is a wildcard section: every key in it is applied to all other
#     sections unless a model's own section overrides that key.
#   - Keys are llama-server CLI flags with the leading dashes removed
#     (e.g. --ctx-size becomes ctx-size). Long or short flag names both work.
#   - Lines starting with # or ; are comments.
#
# Setting reference (see `llama-server --help` for full/authoritative docs):
#
#   device              Backend device to offload to. "Vulkan0" is this
#                        machine's iGPU (AMD Ryzen AI Max 395+ APU).
#   sleep-idle-seconds   Idle seconds before the server sleeps a loaded model
#                        to free memory for another model to load.
#   metrics              Expose the Prometheus-compatible /metrics endpoint.
#   verbose              Maximum log verbosity, useful while tuning settings.
#
#   model                Path to the model's primary GGUF weights.
#   model-draft           Path to a separate draft/MTP model file, only
#                        needed when the draft head isn't embedded in the
#                        main GGUF (see spec-type/spec-draft-n-max below).
#   mmproj               Path to the multimodal projector GGUF, enabling
#                        image input for vision-capable models.
#   jinja                Use the Jinja2 chat template engine. Required for
#                        these models' templates (incl. thinking-mode
#                        control via --chat-template-kwargs).
#   ctx-size             Context window size, in tokens.
#   threads               CPU threads used for generation (-1 = auto).
#   batch-size            Logical max batch size for prompt processing.
#   ubatch-size           Physical max batch size for prompt processing.
#   parallel              Number of concurrent server slots. Kept at 1
#                        because MTP speculative decoding does not yet
#                        support multiple slots.
#   cont-batching         Continuous (dynamic) batching across slots.
#   cache-prompt          Reuse cached KV state across requests that share
#                        a prompt prefix.
#   fit                  Auto-adjust any unset parameters (e.g. context
#                        size, GPU layers) so the model fits in available
#                        device memory. Left to decide GPU layers itself
#                        since this is a unified-memory APU, not a
#                        discrete GPU with fixed VRAM.
#   flash-attn            Enable the Flash Attention kernel.
#
#   temp / top-p / top-k / min-p
#                        Sampling parameters controlling output randomness
#                        and truncation. Values below follow each model
#                        family's documented recommended sampling recipe.
#
#   spec-type             Speculative decoding algorithm. "draft-mtp" uses
#                        the model's own multi-token-prediction head to
#                        draft tokens that the main model then verifies.
#   spec-draft-n-max      Max number of tokens speculatively drafted per
#                        step. Optimal value is hardware-dependent; 2-4 is
#                        a reasonable starting point, accuracy/throughput
#                        trade-off flattens or reverses beyond that.
#
# Performance-tuning settings:
#
#   cache-type-k/-v       Quantize the KV cache (e.g. q8_0) instead of the
#                        f16 default. Reduces memory bandwidth/footprint,
#                        which matters on a bandwidth-bound unified-memory
#                        APU, at a small quality cost. Requires flash-attn.
#   backend-sampling      (Experimental) perform token sampling on-device
#                        instead of copying logits back to the CPU each
#                        step, lowering per-token latency.
#   direct-io             Bypass the OS page cache when loading model
#                        weights. Worth it here because sleep-idle-seconds
#                        causes models to be unloaded/reloaded repeatedly.
#   swa-full              Use a full-size sliding-window-attention cache
#                        instead of the reduced default. Costs memory but
#                        makes cache-prompt reuse robust across long
#                        contexts. Only applies to models using SWA
#                        (Gemma and North Mini Code here; Qwen3.6 uses
#                        full attention).
#   n-cpu-moe             Keep the first N layers' worth of
#                        Mixture-of-Experts weights on the CPU instead of
#                        the GPU. Only applies to MoE models (the "A4B"/
#                        "A3B" models here). On a unified-memory APU this
#                        trades GPU compute load for CPU compute load
#                        rather than saving memory; the ideal N is
#                        hardware/workload dependent, so treat the value
#                        below as a starting point to tune.
# =============================================================================

[*]
device = Vulkan0
sleep-idle-seconds = 100000
metrics = true
verbose = true
cache-type-k = q8_0
cache-type-v = q8_0
backend-sampling = true
direct-io = true

# Type: MoE (~4B active / ~25B total parameters), vision-capable (mmproj).
# Use cases: general-purpose multimodal chat/assistant workloads where
# lower per-token compute (sparse MoE activation) matters more than the
# extra per-token quality of the dense 31B variant below.
# Gemma 4 QAT family (unsloth): recommended sampling is temp=1.0, top-p=0.95,
# top-k=64, min-p=0.0. Both sizes ship a separate MTP draft file (not fetched
# by -hf, see download-models.bat) hence the explicit model-draft path.
# Model cards recommend --spec-draft-n-max 4 for these. Gemma's sliding
# window attention benefits from swa-full (see header). This variant is
# MoE ("A4B" = 4B active), so n-cpu-moe also applies here; the 31B variant
# below is dense and has no MoE weights to offload.
# ctx-size: this entry is one of the 3 models routinely kept resident
# together (with muse-glimmer-30b and qwen3.8-27b below) on the 96GB
# Vulkan0 iGPU, so its context is sized to share that budget rather than
# maximize standalone. Per config.json (gemma-4-26B-A4B-it-qat-GGUF repo):
# 30 layers, 8 KV heads, head_dim 256; swa-full means all 30 layers pay
# full per-token KV cost (2*8*256*1.0625 bytes/layer/token ~= 4.25KB/token/
# layer, ~130.6KB/token across all 30 layers), so 131072 ctx ~= 15.9GB KV
# cache. Combined with the weights+mmproj+mtp-draft here (14.2+1.19+0.25
# ~= 15.6GB) that's ~31.5GB for this entry alone; see qwen3.8-27b's comment
# below for the full 3-model total (~84GB of 96GB, ~12GB headroom).
# Docs: https://unsloth.ai/docs/models/gemma-4/qat
# Model card: https://huggingface.co/unsloth/gemma-4-26B-A4B-it-qat-GGUF
[gemma-4-26B-A4B-it-qat]
model = models/models--unsloth--gemma-4-26B-A4B-it-qat-GGUF/snapshots/c1f25db7cf31985b52caa1db777eb72d17ca1c7c/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
model-draft = models/models--unsloth--gemma-4-26B-A4B-it-qat-GGUF/snapshots/c1f25db7cf31985b52caa1db777eb72d17ca1c7c/mtp-gemma-4-26B-A4B-it.gguf
mmproj = models/models--unsloth--gemma-4-26B-A4B-it-qat-GGUF/snapshots/c1f25db7cf31985b52caa1db777eb72d17ca1c7c/mmproj-BF16.gguf
jinja = true
ctx-size = 131072
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
spec-type = draft-mtp
spec-draft-n-max = 4
swa-full = true
n-cpu-moe = 4

# Type: Dense (~31B parameters), vision-capable (mmproj).
# Use cases: higher-quality single-stream reasoning, writing, and
# multimodal tasks where the extra per-token compute (every parameter
# active every token) is worth it versus the MoE 26B-A4B variant above.
# ctx-size: this entry is run standalone (swapped into a slot instead of
# the 26B-A4B/muse-glimmer/qwen3.8 trio above), so it's sized against the
# full 96GB budget rather than shared -- but the binding constraint here
# is the model's own max_position_embeddings (262144 per config.json), not
# VRAM: at 262144, KV cache is only ~2.1GB (60 layers, 16 KV heads,
# head_dim 256, swa-full => 2*16*256*1.0625 ~= 8.5KB/token/layer, ~510KB/
# token total), and weights+mmproj+mtp-draft here are ~18.8GB, so this sits
# at ~21GB of 96GB even at the model's max context -- nowhere near the
# ceiling. Not extended past 262144 since YaRN/rope-scaling support beyond
# that isn't documented for this family.
# Docs: https://unsloth.ai/docs/models/gemma-4/qat
# Model card: https://huggingface.co/unsloth/gemma-4-31B-it-qat-GGUF
[gemma-4-31B-it-qat]
model = models/models--unsloth--gemma-4-31B-it-qat-GGUF/snapshots/1f1e54258d4a2cf7522856a5789045d9f2ea6d16/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
model-draft = models/models--unsloth--gemma-4-31B-it-qat-GGUF/snapshots/1f1e54258d4a2cf7522856a5789045d9f2ea6d16/mtp-gemma-4-31B-it.gguf
mmproj = models/models--unsloth--gemma-4-31B-it-qat-GGUF/snapshots/1f1e54258d4a2cf7522856a5789045d9f2ea6d16/mmproj-BF16.gguf
jinja = true
ctx-size = 262144
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
spec-type = draft-mtp
spec-draft-n-max = 4
swa-full = true

# Type: Dense (~27B parameters), vision-capable, hybrid thinking/instruct
# modes. Use cases: coding, agentic tool-use, and complex reasoning tasks
# that benefit from an extended thinking trace before answering.
# Qwen3.6 MTP family (unsloth): recommended general/thinking-mode sampling
# is temp=1.0, top-p=0.95, top-k=20, min-p=0.0 (use temp=0.6 for precise
# coding, or top-p=0.8/presence-penalty=1.5 for non-thinking instruct mode
# -- not set globally here since thinking mode is this template's default).
# The MTP draft head is embedded in the main GGUF (unlike Gemma above), so
# no separate model-draft file is needed. Docs suggest --spec-draft-n-max 2
# as a starting point but note it's hardware-dependent; try 1-6. Qwen3.6
# uses full attention (no SWA), so swa-full does not apply. This 27B
# variant is dense (no MoE weights), unlike the 35B-A3B variant below.
# ctx-size: run standalone, sized against the full 96GB budget. Fetched
# config.json (via the Qwen/Qwen3.6-27B base repo, since the GGUF repo has
# no config.json) gives 64 layers, 4 KV heads, head_dim 256, max_position_
# embeddings 262144 -- note these numbers are IDENTICAL to qwen3.8-27b's
# fetched config below, which is suspicious for a distinct model
# generation and could not be corroborated against a second source; taken
# as a reasonable proxy given the "successor" relationship but flagged as
# unverified. Full attention across 64 layers => 2*4*256*1.0625 ~=
# 2.13KB/token/layer, ~136KB/token total; at the 262144 native cap that's
# only ~0.53GB KV cache. Weights+mmproj here are ~18.8GB, so this totals
# ~21GB of 96GB even at max context -- VRAM is not the binding constraint,
# max_position_embeddings is. Not extended past it (no YaRN/rope-scaling
# documented).
# Docs: https://unsloth.ai/docs/models/qwen3.6
# Model card: https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF
[qwen3.6-27b-mtp]
model = models/models--unsloth--Qwen3.6-27B-MTP-GGUF/snapshots/5cb35eb3dcbf52dbce5f87dbc64df6aaffadcace/Qwen3.6-27B-UD-Q4_K_XL.gguf
mmproj = models/models--unsloth--Qwen3.6-27B-MTP-GGUF/snapshots/5cb35eb3dcbf52dbce5f87dbc64df6aaffadcace/mmproj-BF16.gguf
jinja = true
ctx-size = 262144
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
spec-type = draft-mtp
spec-draft-n-max = 2

# Type: MoE (~3B active / ~35B total parameters), vision-capable, hybrid
# thinking/instruct modes. Use cases: broader general-knowledge/reasoning
# coverage than the dense 27B variant above, at MoE-level inference speed;
# a reasonable default for varied everyday queries.
# This variant is MoE ("A3B" = 3B active), so n-cpu-moe applies here.
# ctx-size: run standalone, sized against the full 96GB budget. Fetched
# config.json (Qwen/Qwen3.6-35B-A3B base repo) gives 40 layers, 2 KV heads,
# head_dim 256, 256 experts, max_position_embeddings 262144 (single-source
# fetch, not cross-verified). Full attention across 40 layers =>
# 2*2*256*1.0625 ~= 1.06KB/token/layer, ~42.5KB/token total; at the 262144
# native cap that's only ~0.27GB KV cache. Weights+mmproj here are
# ~23.8GB (n-cpu-moe=4 offloads a little of that to CPU RAM, but the
# on-disk GGUF size is used as the VRAM proxy per this file's usual
# convention), so this totals ~26GB of 96GB even at max context -- VRAM is
# not the binding constraint here either. Not extended past 262144 (no
# YaRN/rope-scaling documented).
# Docs: https://unsloth.ai/docs/models/qwen3.6
# Model card: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF
[qwen3.6-35b-a3b-mtp]
model = models/models--unsloth--Qwen3.6-35B-A3B-MTP-GGUF/snapshots/5bc3e238d916f48a861bac2f8a1990a0e9b7e98d/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj = models/models--unsloth--Qwen3.6-35B-A3B-MTP-GGUF/snapshots/5bc3e238d916f48a861bac2f8a1990a0e9b7e98d/mmproj-BF16.gguf
jinja = true
ctx-size = 262144
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
spec-type = draft-mtp
spec-draft-n-max = 2
n-cpu-moe = 4

# Type: MoE (~3B active / ~30B total parameters, 8 of 128 experts per
# token), no vision, hybrid interleaved sliding-window/global attention
# (3:1 ratio), interleaved thinking with native tool-calling.
# Use cases: dedicated agentic coding/software-engineering model, as
# opposed to the general-purpose families above.
# North Mini Code (CohereLabs "cohere2moe" arch, unsloth quant): recommended
# sampling is temp=1.0, top-p=0.95 (top-k/min-p aren't documented by the
# model card, so left unset here rather than guessed). No MTP draft file
# ships with this GGUF (unlike the Qwen3.6 family above), so no
# spec-type/model-draft entries. Uses SWA like Gemma above (Qwen3.6 doesn't),
# so swa-full applies; n-cpu-moe also applies as this is MoE.
# Requires a llama.cpp build containing the cohere2-MoE arch support
# (merged 2026-06-13, https://github.com/ggml-org/llama.cpp/pull/24260) --
# any reasonably current winget install should have it.
# ctx-size: run standalone, sized against the full 96GB budget. Fetched
# config.json (unsloth/North-Mini-Code-1.0 base repo, GGUF repo has no
# config.json) gives 49 layers, 4 KV heads, head_dim 128, a 1:3 full:sliding
# pattern (sliding_window 4096), and max_position_embeddings 500000 --
# that unusual (non-power-of-2) figure is exactly what the config reports,
# not a rounding choice. swa-full means all 49 layers pay full per-token
# KV cost: 2*4*128*1.0625 ~= 1.06KB/token/layer, ~52KB/token total; at the
# 500000 native cap that's ~24.8GB KV cache. No mmproj/draft here, so
# weights (19.3GB) + KV (~24.8GB) + ~2GB overhead totals ~46GB of 96GB --
# comfortably under budget even at the model's max context, so capped at
# 500000 rather than VRAM.
# Model card: https://huggingface.co/unsloth/North-Mini-Code-1.0-GGUF
[north-mini-code-1.0]
model = models/models--unsloth--North-Mini-Code-1.0-GGUF/snapshots/e306bb4bf0df610f5471d97a01de2b6e0b24d356/North-Mini-Code-1.0-UD-Q4_K_XL.gguf
jinja = true
ctx-size = 500000
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
temp = 1.0
top-p = 0.95
swa-full = true
n-cpu-moe = 4

# Type: MoE (~8B active / ~118B total parameters, 256 routed + 1 shared
# expert, top-10 routing), no vision, mixed global/sliding-window attention
# (1:3 ratio, 512-token SWA window), native 1M-token context, interleaved
# thinking with tool-calling.
# Use cases: agentic coding and long-horizon software-engineering work at a
# larger-model quality tier than the families above (still heavier than the
# other entries even at this reduced quant: ~40GB on disk, vs <20GB for the
# others). UD-Q2_K_XL is a single root-level file in the repo (unlike
# UD-Q4_K_XL, which is split into 3 shards under a UD-Q4_K_XL/ subfolder),
# so no shard/subfolder handling is needed here.
# Laguna S 2.1 (Poolside, unsloth quant): the model card does not publish a
# recommended sampling recipe, so temp/top-p/top-k/min-p are left unset here
# (server defaults apply) rather than guessed. ctx-size: run standalone,
# sized against the full 96GB budget -- unlike the other standalone entries
# here, this one IS VRAM-bound, not context-cap-bound. Fetched config.json
# (unsloth/Laguna-S-2.1 base repo) gives 48 layers, 8 KV heads, head_dim
# 128, a 1:3 full:sliding pattern (sliding_window 512), and confirms the
# 1,048,576 max_position_embeddings already noted above. swa-full means all
# 48 layers pay full per-token KV cost: 2*8*128*1.0625 ~= 2.13KB/token/
# layer, ~102KB/token total. At the full native 1,048,576 ctx that's
# ~102GB of KV cache alone -- added to the ~39.7GB UD-Q2_K_XL weights, that
# would blow well past 96GB. Solved for the largest ctx that keeps
# weights+KV+~2GB overhead under the ~85-90GB target: 458752 (7/16 of the
# native max) costs ~47.9GB KV, for a ~89.6GB total (~6.4GB headroom under
# 96GB) -- raise ctx-size further only if you free up VRAM elsewhere (e.g.
# don't run this alongside another large model, or drop n-cpu-moe further).
# A "DFlash" speculative-decoding draft model exists for this family, but
# --spec-type draft-dflash is only implemented on Poolside's llama.cpp fork
# (branch `laguna`), not in mainline, so no spec-type/model-draft entries
# are set here. Base architecture support landed upstream at release
# b10087, so any llama.cpp build from that release or newer should load
# this fine (without DFlash). Uses SWA like Gemma/North Mini above, so
# swa-full applies; n-cpu-moe also applies as this is MoE.
# Model card: https://huggingface.co/unsloth/Laguna-S-2.1-GGUF
[laguna-s-2.1]
model = models/models--unsloth--Laguna-S-2.1-GGUF/snapshots/0d1759155994f502f12d8ce84d73cf316e00f42e/Laguna-S-2.1-UD-Q2_K_XL.gguf
jinja = true
ctx-size = 458752
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
swa-full = true
n-cpu-moe = 4

# Type: Dense (~30B parameters), vision-capable (mmproj), controllable
# reasoning effort (low/medium/high/xhigh), hybrid sliding-window/global
# attention (3:1 ratio, 2048-token SWA window; the 4th/global layer uses
# NoPE instead of RoPE).
# Use cases: Meta's local agentic/coding/multimodal model, general-purpose
# alternative to the Gemma/Qwen3.6 families above with a native
# self-healing tool-calling mode.
# Muse Glimmer (Meta, unsloth quant): recommended sampling is temp=1.0,
# top-p=0.95, top-k=64 (min-p not documented, left unset). Reasoning
# effort is documented only at the "supports low/medium/high/xhigh" level --
# the exact mechanism (system-prompt text vs a --chat-template-kwargs field)
# isn't specified by the model card, so it's left at the template's default
# here rather than guessed; --jinja is required either way for the chat
# template to apply. ctx-size: this entry is one of the 3 models routinely
# kept resident together (with gemma-4-26B-A4B-it-qat above and qwen3.8-27b
# below) on the 96GB Vulkan0 iGPU, so it's set to 131072 -- the model's own
# documented default cap (of a 262144 supported max), which conveniently
# also matches the trio's shared context target. Fetched config.json
# (unsloth/Muse-Glimmer-30B base repo) gives 52 layers, 2 KV heads,
# head_dim 128, a 3:1 sliding:full pattern (sliding_window 2048); swa-full
# means all 52 layers pay full per-token KV cost: 2*2*128*1.0625 ~=
# 0.53KB/token/layer, ~27.6KB/token total, so 131072 ctx ~= 3.45GB KV
# cache. Combined with weights+mmproj here (15.9+3.85 ~= 19.75GB) that's
# ~23.2GB for this entry alone; see qwen3.8-27b's comment below for the
# full 3-model total. This is a dense model (no MoE weights), so n-cpu-moe
# doesn't apply. Ships a DFlash drafter file (dflash-kquant.gguf) for
# speculative decoding, but llama.cpp's --spec-type flag for it isn't
# documented by the model card or the PR that added arch support, so no
# spec-type/model-draft entries are set here (same caution as Laguna S
# above). Uses SWA, so swa-full applies (see header).
# Requires a llama.cpp build containing the muse-glimmer arch support
# (merged 2026-08-10, https://github.com/ggml-org/llama.cpp/pull/26841) --
# this was added the same day this entry was written, so a `winget upgrade`
# (see start-llama-cpp-server.bat's update prompt) is likely needed before
# an existing install can load it.
# Model card: https://huggingface.co/unsloth/Muse-Glimmer-30B-GGUF
[muse-glimmer-30b]
model = models/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
mmproj = models/models--unsloth--Muse-Glimmer-30B-GGUF/snapshots/faa5b025c584459c13febfa5c59883516710ae39/mmproj-Muse-Glimmer-30B-BF16.gguf
jinja = true
ctx-size = 131072
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
temp = 1.0
top-p = 0.95
top-k = 64
swa-full = true

# Type: Dense (~27B parameters), vision-capable (mmproj), hybrid
# thinking/instruct modes with adjustable reasoning effort (xhigh default,
# medium, low, none), hybrid linear/full attention (3 linear-attention layers
# per 1 full-attention layer, per config.json; no sliding window, so
# swa-full does not apply).
# Use cases: coding, professional work, research, and long-horizon agentic
# tasks; successor to the Qwen3.6-27B-MTP family above.
# Qwen3.8 family (unsloth): recommended thinking-mode sampling is temp=1.0,
# top-p=0.95, top-k=20, min-p=0.0 (use temp=0.7/top-p=0.80/presence-penalty=1.5
# for non-thinking instruct mode -- not set globally here since thinking mode
# is this template's default). Reasoning effort can be adjusted via
# --chat-template-kwargs '{"reasoning_effort":"medium"}' (xhigh/medium/low/none).
# MTP is documented as "enabled for fast inference"; as with Qwen3.6 above, no
# separate draft file is listed in the repo, so it's presumably embedded in
# the main GGUF (no model-draft entry needed) -- unverified without an actual
# load/test. The docs don't publish a --spec-draft-n-max value for this
# family; 2 is carried over from the Qwen3.6 entry above as a starting point
# (same MTP mechanism, hardware-dependent -- try 1-6). The repo ships two
# mmproj options (BF16, F16); BF16 is used here to match the other vision
# models, but -hf's auto-selected default hasn't been verified (see Muse
# Glimmer above, where -hf's default silently picked Q8_0 instead).
# ctx-size: this entry is one of the 3 models routinely kept resident
# together (with gemma-4-26B-A4B-it-qat and muse-glimmer-30b above) on the
# 96GB Vulkan0 iGPU, so it's set to 131072 -- comfortably inside the
# 262144 native max, no YaRN extension needed. Only 1-in-4 layers (16 of
# 64) are full attention here; the other 48 are linear-attention with an
# ~O(1) state that doesn't scale with ctx_size (roughly estimated from
# config.json's linear_num_value_heads=48/value_head_dim=128 as
# ~48*128*128*2 bytes/layer =~ 1.5MB/layer, ~72MB total -- a minor,
# not-precisely-verified constant, included in the total below). The 16
# full-attention layers use 4 KV heads, head_dim 256: 2*4*256*1.0625 ~=
# 2.13KB/token/layer, ~34KB/token across those 16 layers, so 131072 ctx ~=
# 4.25GB KV cache. Combined with weights+mmproj here (17.9+0.93 ~=
# 18.83GB) that's ~23.2GB for this entry alone.
# Full 3-model resident total at these ctx-sizes: weights+mmproj+mtp-draft
# 54.2GB + qwen3.8's ~0.1GB linear-attention state + ~6GB compute-buffer
# overhead (~2GB/model, a rule-of-thumb estimate) + KV caches (15.9 +
# 3.45 + 4.25 = 23.6GB) =~ 84GB of 96GB, leaving ~12GB headroom -- some of
# these figures (compute-buffer overhead, the MoE n-cpu-moe VRAM discount
# on the 26B-A4B entry, the linear-attention state size) are estimates,
# not measured, so treat the ~12GB headroom as a safety margin for that
# imprecision rather than genuinely free capacity.
# Docs: https://unsloth.ai/docs/models/qwen3.8
# Model card: https://huggingface.co/unsloth/Qwen3.8-27B-GGUF
[qwen3.8-27b]
model = models/models--unsloth--Qwen3.8-27B-GGUF/snapshots/f1bfb127c64f7072bdd2cad55f258b9c8b2910fe/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj = models/models--unsloth--Qwen3.8-27B-GGUF/snapshots/f1bfb127c64f7072bdd2cad55f258b9c8b2910fe/mmproj-BF16.gguf
jinja = true
ctx-size = 131072
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
spec-type = draft-mtp
spec-draft-n-max = 2

# Type: MoE (~13B active / ~284B total parameters per a secondary hardware
# guide; the base repo's own page states "304B params" with no active/total
# split given, so the total is treated as approximate/unresolved between
# these two single-source figures), 256 routed + 1 shared experts, top-6
# routing, no vision, novel compressed attention (CSA/HCA, NOT the standard
# sliding-window attention the other entries' swa-full flag targets -- see
# below), native 1,048,576-token context via YaRN (factor 16 over a 65536
# pre-YaRN base).
# Use cases: DeepSeek's largest/highest-quality local model in this file by
# a wide margin (~91GB on disk at this quant vs <40GB for every other entry
# here); agentic coding and long-horizon reasoning where that extra quality
# is worth the very tight memory fit documented below.
# DeepSeek-V4-Flash (deepseek_v4 arch, unsloth quant): docs (unsloth.ai/docs/
# models/deepseek-v4) give temp=1.0/top-p=1.0 for general use, temp=1.0/
# top-p=0.95/min-p=0.01 for agentic use (top-k not documented, left unset);
# agentic recipe is used here since that matches this file's other
# standalone "large model" entries' use case. Reasoning effort ("low"/
# "high"/"max", no "medium" tier) is high by default -- matches this
# template's default, so left unset rather than guessed; adjust via
# --chat-template-kwargs '{"reasoning_effort":"max"}' if needed. --jinja is
# required either way for the chat template to apply.
# REQUIRES OVERRIDING THE [*] WILDCARD'S cache-type-k/-v = q8_0: as of this
# writing, quantized K-cache produces garbage output for this arch on
# llama.cpp master -- ggml-org/llama.cpp#25202 claimed to fix it but
# ggml-org/llama.cpp#26423 (opened after, closed as "not planned") shows the
# corruption persists on master even with that fix in, and the actual
# arch-scoped rotation-disable patch (ggml-org/llama.cpp#25391) was closed
# unmerged. Do not remove this entry's cache-type-k/-v override to f16
# without first confirming upstream that this is actually fixed.
# model-draft/spec-type: DSpark speculative decoding IS configured, via
# --spec-type draft-dspark against the repo's root-level dspark-DeepSeek-V4-
# Flash-0731-Q8_0.gguf (10.9GB) -- supported upstream for this arch (unlike
# Laguna S's DFlash above, which mainline doesn't support at all). This was
# initially left out on memory grounds (that file plus this quant's ~90.9GB
# of weights is ~101.8GB before KV cache/overhead, over this machine's usual
# 96GB target), but the user has confirmed this APU can be reconfigured to
# allocate up to 112GB, which is the budget this entry (uniquely in this
# file) is sized against below -- keep that in mind if comparing its numbers
# against the other "96GB" entries above. --spec-draft-n-max 3 is the
# recipe's documented starting point. MTP is not used -- DeepSeek did not
# ship an MTP head with the 0731 checkpoint, only DSpark.
# n-cpu-moe applies (MoE) per the header's usual caveat (compute-load
# shift only, no memory savings on this unified-memory APU). swa-full is
# left unset: llama.cpp's implementation adds dedicated wrapper caches for
# this arch's CSA/HCA compressed attention rather than reusing the standard
# SWA cache path the other SWA entries in this file rely on, so it's unclear
# the flag does anything here -- not set rather than guessed.
# ctx-size / memory fit: even against the enlarged 112GB budget, this
# remains the tightest entry in this file, and unlike the other "standalone"
# entries above, the binding constraint is the WEIGHTS THEMSELVES (now two
# models' worth), not KV cache or context caps -- an independent hardware
# guide (modemguides.com) puts IQ2_XXS's combined memory floor at
# 92-102GB alone, before adding the draft model. Fetched config.json
# (unsloth/DeepSeek-V4-Flash-0731 base repo) gives 43 main layers (+3 "hash"
# layers, 46 total) and a per-layer compress_ratios array showing only 5 of
# those 46 layers run full/dense attention (ratio 0); 21 run CSA (ratio 4)
# and 20 run HCA (ratio 128). Treating each compressed layer's per-token KV
# cost as (dense cost / ratio) -- a rough approximation, not verified
# against llama.cpp's actual implementation of these novel cache types --
# gives roughly 21KB/token at f16 (2*1 KV head*512 head_dim*2 bytes/layer
# for dense layers, scaled down per-layer by the ratios above). At ctx-size
# 131072 (a round, comfortably-under-budget choice rather than reaching for
# the full YaRN-extended 1,048,576 max) that's ~2.75GB of KV cache. So:
# ~90.9GB main weights (3 shards: 5.26MB+49.9GB+41GB) + ~10.9GB DSpark
# weights + ~2.75GB KV cache + ~4GB compute-buffer overhead (this file's
# usual ~2GB/model rule of thumb, doubled for the two resident models) =~
# 108.55GB of 112GB, leaving ~3.45GB of headroom for OS and for the KV/
# compress-ratio estimate above being wrong in the unfavorable direction.
# If this doesn't fit, reduce ctx-size first (try 65536, ~1.3GB KV instead
# of ~2.75GB): per the header, n-cpu-moe does NOT free memory on this
# unified-memory APU, so it will not help here.
# Model card: https://huggingface.co/unsloth/DeepSeek-V4-Flash-0731-GGUF
[deepseek-v4-flash-0731]
model = models/models--unsloth--DeepSeek-V4-Flash-0731-GGUF/snapshots/fbbb5b93fb787c21338159b0af3318bb3f4d9768/UD-IQ2_XXS/DeepSeek-V4-Flash-0731-UD-IQ2_XXS-00001-of-00003.gguf
model-draft = models/models--unsloth--DeepSeek-V4-Flash-0731-GGUF/snapshots/fbbb5b93fb787c21338159b0af3318bb3f4d9768/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf
jinja = true
ctx-size = 131072
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
cache-type-k = f16
cache-type-v = f16
temp = 1.0
top-p = 0.95
min-p = 0.01
spec-type = draft-dspark
spec-draft-n-max = 3
n-cpu-moe = 4

# Type: MoE (~6B active / ~125B total, plus a 51B-parameter n-gram embedding
# table and a 4B MTP head not counted in the "active" figure), 512 routed
# experts + 1 shared, top-10 routing, vision-capable (mmproj), hybrid
# thinking/instruct modes with adjustable reasoning effort (xhigh default,
# medium, low -- no "high" tier, unlike the Qwen3.6/3.8 families above).
# Architecture ("qwen4_exp"/"Qwen4ExpForConditionalGeneration", HF repo
# calls it Qwen3.8-Flash-Next): experimental pre-Qwen4 design, 48 layers in
# a repeating 12x(3x linear-attention/Gated DeltaNet -> MoE, then 1x
# QSA/Qwen-Sparse-Attention -> MoE) pattern (config.json's layer_types: 36
# linear_attention + 12 full_attention, where "full_attention" here actually
# means the QSA sparse-attention layer type, budgeted at indexer_budget=2048
# tokens per the model card -- not literally unbounded dense attention).
# No sliding-window attention (linear/QSA hybrid instead), so swa-full does
# not apply, same as the Qwen3.6/3.8 dense entries above.
# Use cases: general-purpose multimodal chat/agentic work at a much larger
# nominal parameter count than the other MoE entries here, at MoE-level
# active compute (~6B/token) similar in spirit to gemma-4-26B-A4B above.
# Sampling: thinking-mode recipe (used here, since thinking is this
# template's default) is temp=1.0/top-p=0.95/top-k=20/min-p=0.0 (instruct/
# non-thinking mode: temp=0.7/top-p=0.80/top-k=20/min-p=0.0/
# presence-penalty=1.5, not set globally here). --jinja required for the
# chat template and reasoning-effort control.
# REQUIRES a llama.cpp build containing the qwen4exp arch support merged
# 2026-08-27 (ggml-org/llama.cpp#27742, +follow-up #27880). On 2026-09-04 a
# winget install at that point still threw "unknown model architecture:
# 'qwen4exp'"; after a `winget upgrade --id ggml.llamacpp` (build
# b10795-6703d7894), it loads and generates correctly -- confirmed via a
# direct llama-cli smoke test, so whatever the gap was, it's resolved as of
# that build. cache-type-k/-v is overridden to f16 here, overriding the [*]
# wildcard's q8_0 default: a report from around the PR's merge window
# (hospedales.com, "qwen4exp is not qwen3next") describes quantized KV
# cache crashing this architecture. Whether that was fixed by the time of
# the final merge is unconfirmed in this session -- treat the f16 override
# as the safe default and only drop it after verifying q8_0 works on a
# current build.
# No model-draft/spec-type entries: an MTP head exists (mtp_num_hidden_
# layers=1 in config.json) and the repo ships a root-level MTP/ folder, but
# --spec-type draft-mtp support for this arch (ggml-org/llama.cpp#28243) is
# still an unmerged draft PR as of this writing (2026-09-04) -- the same
# source above notes the shipped GGUF's MTP head has no working speculative-
# decoding path in llama.cpp yet despite the model card advertising 1.3-1.7x
# speedups from it. Revisit once #28243 merges.
# override-tensor: the PR author's own announcement (a single-source X/
# Twitter post, not independently verified here) recommends
# `-ot "ple_ngram_embd=CPU"` to keep the ~51B-parameter n-gram embedding
# table off the compute backend, since it's a lookup table with no real
# benefit from GPU/Vulkan execution -- included here on that recommendation.
# As with n-cpu-moe (see header), this is a compute-placement choice, not a
# memory-saving one, on this unified-memory APU: the tensor's weights are
# already counted in the on-disk GGUF size below regardless of which backend
# runs the lookup.
# ctx-size / memory fit: run standalone, sized against the full 96GB budget.
# Weights (UD-Q2_K_XL, 3 shards: 10.9MB+50GB+28.9GB) total ~78.9GB, plus
# mmproj-BF16.gguf (~0.9GB, matching this file's other vision entries'
# BF16 choice over F16) = ~79.8GB before KV cache -- meaningfully more
# headroom than the DeepSeek-V4-Flash entry above. Fetched config.json
# (unsloth/Qwen3.8-Flash-Next base repo) gives head_dim 256, 2 KV heads for
# the 12 QSA/"full_attention" layers: 2*2*256*2 bytes (f16) ~= 2KB/token/
# layer, ~24.6KB/token across those 12 layers -- an upper-bound estimate,
# since QSA's own 2048-token attention budget likely caps real usage lower;
# not verified against llama.cpp's actual implementation. The 36 linear-
# attention (Gated DeltaNet) layers carry an ~O(1) recurrent state instead
# of a growing KV cache, roughly estimated the same way qwen3.8-27b's
# linear-attention state was above (linear_num_value_heads=48 *
# linear_value_head_dim=128 * linear_key_head_dim=128 * 2 bytes/layer =~
# 1.5MB/layer, ~54MB total across 36 layers) -- a minor, not-precisely-
# verified constant. At the native 262144 max (no YaRN extension needed;
# 1M is documented as reachable via YaRN but not used here), KV cache is
# ~262144*24.6KB =~ 6.15GB. Total: ~79.8GB weights+mmproj + ~6.15GB KV +
# ~2GB compute-buffer overhead (this file's usual rule of thumb) =~ 88GB of
# 96GB, leaving ~8GB headroom -- some of these figures (the QSA budget
# discount, the linear-attention state size, compute-buffer overhead) are
# estimates, not measured, same caveat as the qwen3.8-27b entry above.
# Model card: https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF
[qwen3.8-flash-next]
model = models/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/38bb39ee97821de2c9009abb7e93950eec396e66/UD-Q2_K_XL/Qwen3.8-Flash-Next-UD-Q2_K_XL-00001-of-00003.gguf
mmproj = models/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/38bb39ee97821de2c9009abb7e93950eec396e66/mmproj-BF16.gguf
jinja = true
ctx-size = 262144
threads = -1
batch-size = 2048
ubatch-size = 512
parallel = 1
cont-batching = true
cache-prompt = true
fit = on
flash-attn = on
cache-type-k = f16
cache-type-v = f16
override-tensor = ple_ngram_embd=CPU
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
n-cpu-moe = 4
